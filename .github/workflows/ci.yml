# protect-workflows 盯着 .github/workflows/**。改这个文件的 PR 会命中该规则（mode: block）。
# 演示：故意改 workflow，让 block 模式下的 docket/gate 失败。
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: npm test
        run: npm test
